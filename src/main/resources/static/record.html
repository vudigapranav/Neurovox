<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#050309">
    <meta name="color-scheme" content="dark">
    <meta name="description" content="Record the four Neurovox voice tasks. Recordings are stored on this computer.">
    <title>Record · Neurovox</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23c79bff' stroke-width='2' stroke-dasharray='1.2 2.6'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <script type="module" src="js/record.js"></script>
  </head>
  <body class="recorder-page">
    <a class="skip-link" href="#main">Skip to content</a>

    <div class="stage" aria-hidden="true">
      <div class="stage-glow"></div>
      <canvas id="orbFallback" class="orb-fallback"></canvas>
      <canvas id="orbCanvas" class="orb-canvas"></canvas>
      <div class="stage-shade"></div>
    </div>

    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Neurovox home">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="16" r="11.5" />
          <circle class="brand-core" cx="16" cy="16" r="3" />
        </svg>
        <span class="brand-word">neurovox</span>
      </a>
      <ol class="task-steps" id="taskSteps" aria-label="Session progress" hidden></ol>
      <a class="header-tag header-exit" href="index.html">Exit</a>
    </header>

    <main id="main" class="recorder-shell">
      <section class="recorder-panel" aria-label="Voice recorder">
        <div class="recorder-card" id="recorderCard">
          <p class="eyebrow">Guided session</p>
          <h1 class="recorder-title">Loading the recorder…</h1>
          <noscript><p class="alert alert-error">The recorder needs JavaScript enabled.</p></noscript>
        </div>
      </section>

      <button class="orb-hit" id="orbHit" type="button" aria-label="Voice orb. Use arrow keys to tilt it and Enter to send a wave through it.">
        <span class="orb-hint" aria-hidden="true"><kbd>←</kbd><kbd>→</kbd><kbd>↑</kbd><kbd>↓</kbd> tilt <kbd>Enter</kbd> wave</span>
      </button>

      <p class="visually-hidden" id="recorderLive" aria-live="polite"></p>
    </main>
  </body>
</html>
